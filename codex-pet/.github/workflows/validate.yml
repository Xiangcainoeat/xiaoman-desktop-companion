name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate manifest
        run: >-
          python -c "import json, pathlib;
          p=pathlib.Path('pet/xiaoman/pet.json');
          d=json.loads(p.read_text());
          assert d['id']=='xiaoman';
          assert d['spriteVersionNumber']==2;
          assert d['spritesheetPath']=='spritesheet.webp';
          assert (p.parent/d['spritesheetPath']).is_file()"
      - name: Validate atlas
        run: >-
          python scripts/validate_atlas.py
          pet/xiaoman/spritesheet.webp
          --json-out /tmp/xiaoman-validation.json
          --chroma-key '#FF00FF'
          --require-v2
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py'
