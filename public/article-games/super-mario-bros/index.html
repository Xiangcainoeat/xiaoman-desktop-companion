        <style>
            html, body {
                margin: 0;
                background-color: #000;
                overflow: hidden;
                width: 100%;
                height: 100%;
            }
            canvas {
                position: fixed;
                top: 0;
                left: 0;
            }
            /* Local frame adaptation: keep verified keyboard bindings visible without covering play. */
            #xiaoman-mario-keymap {
                position: fixed;
                top: 6px;
                right: 8px;
                z-index: 2;
                margin: 0;
                padding: 3px 6px;
                color: #fff;
                background: rgba(0, 0, 0, .65);
                font: 12px/1.3 system-ui, sans-serif;
                pointer-events: none;
            }
            /* Desktop players use the physical keyboard; keep the canvas clear. */
            @media (hover: hover) and (pointer: fine) {
                #xiaoman-mario-keymap {
                    display: none;
                }
            }
        </style>

    </head>

    <body>
        <img id="mario" src="super-mario-2x.png" style="display:none;" />
        <img id="tiles" src="super-mario-tiles-2x.png" style="display:none;" />
        <img id="enemies" src="super-mario-enemies-2x.png" style="display:none;" />
        <img id="icons" src="icons.png" style="display:none;" />

        <canvas id="foreground" width="960" height="700">
            Your browser does not support canvas element.
        </canvas>
        <p id="xiaoman-mario-keymap" aria-label="键盘操作：左右箭头移动，Z 跳跃，X 奔跑">←/→ 移动 · Z 跳跃 · X 奔跑</p>
        <script src="../xiaoman-frame-adapter.js"></script>
    </body>
