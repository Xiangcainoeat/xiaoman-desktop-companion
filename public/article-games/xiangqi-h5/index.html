<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>中国象棋</title>
  <link href="css/chess.css" rel="stylesheet" type="text/css">
  <style>
    html, body { min-height: 100%; }
    /* Local frame adaptation: the upstream canvas is the complete playable surface. */
    body { margin: 0; overflow: hidden; background-size: cover; font-family: system-ui, sans-serif; }
    .chess_box { width: 523px; margin: 0 auto; }
    #chess { display: block; width: 523px; height: 580px; margin: 0 auto; }
    .bn_box { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; padding: 8px; }
    .bn_box input { min-height: 34px; margin: 0; font-family: system-ui, sans-serif; }
    .menu_box { margin: 0 auto; padding-top: 0; background: none; }
  </style>
</head>
<body>
  <div id="chessBox" class="chess_box">
    <canvas id="chess" data-xiaoman-intrinsic-width="523" data-xiaoman-intrinsic-height="580"></canvas>
    <audio src="audio/click.wav" id="clickAudio" preload="auto"></audio>
    <audio src="audio/select.wav" id="selectAudio" preload="auto"></audio>
    <div class="bn_box" id="bnBox">
      <input type="button" name="restartBtn" id="restartBtn" value="重新开始">
      <input type="button" name="gohomeBtn" id="gohomeBtn" value="返回首页">
      <input type="button" name="regretBtn" id="regretBtn" value="悔棋">
    </div>
  </div>
  <div class="menu_box" id="menuBox">
    <div class="menu_init" id="indexBox"><a id="indexDy">人机对弈</a><a id="indexQj">挑战棋局</a><a id="stypeBtn">更换皮肤</a></div>
    <div class="menu_dy" id="menuDy">
      <div class="menu_info"><div class="menu_fh" id="menuFh"></div><label><input name="depth" type="radio" value="2"> 菜鸟水平</label><br><label><input name="depth" type="radio" value="3" checked> 中级水平</label><br><label><input name="depth" type="radio" value="4"> 高手水平</label></div>
      <a id="playBtn">开始对弈</a>
    </div>
    <div class="menu_qj" id="menuQj">
      <div class="menu_info"><div class="menu_fh" id="menuGb"></div><label><input name="clasli" type="radio" value="0" checked> 八卦阵法</label><br><label><input name="clasli" type="radio" value="1"> 很二棋局</label><br><label><input name="clasli" type="radio" value="2"> 七星会阵</label></div>
      <a id="clasliBtn">开始挑战</a>
    </div>
  </div>
  <script src="js/common.js"></script>
  <script src="js/play.js"></script>
  <script src="js/AI.js"></script>
  <script src="js/gambit.js"></script>
  <script src="js/clasli.js"></script>
  <script src="../xiaoman-frame-adapter.js"></script>
</body>
</html>
